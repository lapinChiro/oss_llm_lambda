name: CD

on:
  workflow_dispatch:
    inputs:
      cdk_env:
        description: "CDK environment (dev or prod)"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - prod

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  APP_NAME: webapp
  CDK_ENV: ${{ github.event.inputs.cdk_env || 'prod' }}

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: "npm"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install dependencies
        run: npm ci

      - name: CDK Deploy
        run: npx cdk deploy --all --require-approval never -c env=${{ env.CDK_ENV }}
        working-directory: ./infra

      - name: Run database migration
        run: |
          RESULT=$(aws lambda invoke \
            --function-name ${{ env.APP_NAME }}-${{ env.CDK_ENV }}-migration \
            --payload '{}' \
            --output json \
            /tmp/migration-result.json)
          echo "$RESULT"
          if echo "$RESULT" | grep -q "FunctionError"; then
            echo "::error::Migration failed"
            cat /tmp/migration-result.json
            exit 1
          fi
          cat /tmp/migration-result.json

      - name: Build types
        run: npm run build -w @app/shared

      - name: Build frontend
        run: npm run build
        working-directory: ./apps/frontend
        env:
          VITE_API_BASE_URL: ""
          # 版識別子: GITHUB_SHA を frontend に注入し、ランタイム /version.json と比較するために使う
          VITE_BUILD_VERSION: ${{ github.sha }}

      - name: Get CDK outputs
        id: cdk-outputs
        run: |
          BUCKET_NAME=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.APP_NAME }}-${{ env.CDK_ENV }}-app \
            --query "Stacks[0].Outputs[?OutputKey=='BucketName'].OutputValue" \
            --output text)
          DISTRIBUTION_ID=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.APP_NAME }}-${{ env.CDK_ENV }}-app \
            --query "Stacks[0].Outputs[?OutputKey=='DistributionId'].OutputValue" \
            --output text)
          echo "bucket_name=$BUCKET_NAME" >> $GITHUB_OUTPUT
          echo "distribution_id=$DISTRIBUTION_ID" >> $GITHUB_OUTPUT

      - name: Deploy hashed assets to S3
        run: |
          # --delete を外す: 旧 hashed asset は S3 lifecycle rule (7 日) に任せる。
          # これにより開きっぱなしタブの旧 SPA が旧チャンクを取得できる猶予期間を確保し、
          # chunk-load 404 による「操作不能」を防ぐ。
          # version.json は immutable cache-control を避け、次工程で no-store として cp するため exclude。
          aws s3 sync apps/frontend/dist/ s3://${{ steps.cdk-outputs.outputs.bucket_name }}/ \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "*.html" \
            --exclude "manifest.json" \
            --exclude "favicon.ico" \
            --exclude "version.json"

      - name: Deploy HTML and metadata to S3
        run: |
          aws s3 cp apps/frontend/dist/index.html \
            s3://${{ steps.cdk-outputs.outputs.bucket_name }}/index.html \
            --cache-control "no-cache, no-store, must-revalidate"

          # version.json: frontend が 5 分間隔で polling して新版を検出するための version manifest。
          # no-store でブラウザ / CloudFront edge に cache させず常に最新を返す。
          aws s3 cp apps/frontend/dist/version.json \
            s3://${{ steps.cdk-outputs.outputs.bucket_name }}/version.json \
            --cache-control "no-cache, no-store, must-revalidate"

          if [ -f apps/frontend/dist/manifest.json ]; then
            aws s3 cp apps/frontend/dist/manifest.json \
              s3://${{ steps.cdk-outputs.outputs.bucket_name }}/manifest.json \
              --cache-control "no-cache, no-store, must-revalidate"
          fi

          if [ -f apps/frontend/dist/favicon.ico ]; then
            aws s3 cp apps/frontend/dist/favicon.ico \
              s3://${{ steps.cdk-outputs.outputs.bucket_name }}/favicon.ico \
              --cache-control "public, max-age=86400"
          fi

      - name: Invalidate CloudFront cache
        run: |
          # /* 全 path invalidation は不要 — hashed asset は content-hash で URL が変わるため
          # 旧 path の cache は別エントリ。新版が反映されればよいのは index.html と version.json。
          aws cloudfront create-invalidation \
            --distribution-id ${{ steps.cdk-outputs.outputs.distribution_id }} \
            --paths "/index.html" "/version.json"

      - name: Print CloudFront domain name
        run: |
          DOMAIN_NAME=$(aws cloudfront get-distribution \
            --id ${{ steps.cdk-outputs.outputs.distribution_id }} \
            --query "Distribution.DomainName" \
            --output text)
          echo "::notice::Deployed to: https://${DOMAIN_NAME}"
